<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Background: warm near-black with depth -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#1c0e02"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>

    <!-- White bar — fades to transparent at tips -->
    <linearGradient id="wBar" gradientUnits="userSpaceOnUse"
                    x1="8" y1="8" x2="32" y2="32">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="40%"  stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Orange bar — vivid at center, fades at tips -->
    <linearGradient id="oBar" gradientUnits="userSpaceOnUse"
                    x1="32" y1="8" x2="8" y2="32">
      <stop offset="0%"   stop-color="#fb923c" stop-opacity="0.1"/>
      <stop offset="36%"  stop-color="#f97316"/>
      <stop offset="64%"  stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Spark radial: warm white core to orange halo -->
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff5eb"/>
      <stop offset="30%"  stop-color="#fdba74" stop-opacity="0.85"/>
      <stop offset="68%"  stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <!-- Bloom filter for orange bar -->
    <filter id="bloom" x="-120%" y="-120%" width="340%" height="340%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="box">
      <rect width="40" height="40" rx="9"/>
    </clipPath>

  </defs>

  <!-- Container background -->
  <rect width="40" height="40" rx="9" fill="url(#bgGrad)"/>

  <!-- Outer border ring -->
  <rect x="0.6" y="0.6" width="38.8" height="38.8" rx="8.4"
        stroke="rgba(249,115,22,0.28)" stroke-width="0.8" fill="none"/>

  <!-- Corner bracket accents -->
  <path d="M4.5 10.5 L4.5 4.5 L10.5 4.5"
        stroke="rgba(249,115,22,0.5)" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <path d="M29.5 4.5 L35.5 4.5 L35.5 10.5"
        stroke="rgba(249,115,22,0.5)" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <path d="M4.5 29.5 L4.5 35.5 L10.5 35.5"
        stroke="rgba(249,115,22,0.5)" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  <path d="M29.5 35.5 L35.5 35.5 L35.5 29.5"
        stroke="rgba(249,115,22,0.5)" stroke-width="1.1" stroke-linecap="round" fill="none"/>

  <g clip-path="url(#box)">

    <!-- White diagonal bar ╲ (top-left → bottom-right) -->
    <rect x="17" y="5.5"
          width="6" height="29"
          rx="3"
          fill="url(#wBar)"
          transform="rotate(45 20 20)"/>

    <!-- Orange diagonal bar ╱ (top-right → bottom-left) with bloom -->
    <rect x="17" y="5.5"
          width="6" height="29"
          rx="3"
          fill="url(#oBar)"
          filter="url(#bloom)"
          transform="rotate(-45 20 20)"/>

  </g>

  <!-- Central spark — large soft halo -->
  <circle cx="20" cy="20" r="6.5" fill="url(#spark)"/>

  <!-- Central spark — tight bright core -->
  <circle cx="20" cy="20" r="1.9" fill="#fff5eb" fill-opacity="0.97"/>

</svg>
