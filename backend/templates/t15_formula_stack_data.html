<div class="scene data" id="scene{{SCENE_NUM}}">
  <div class="float-orb-md" style="top:-10%; left:-5%; background:var(--accent);"></div>
  <div class="aurora-glow" style="bottom:-15%; right:-10%; background:radial-gradient(circle, var(--accent2), transparent);"></div>
  <div class="ghost-text" style="bottom:-8%; right:-5%;">{{GHOST_WORD}}</div>
  <span class="y2k-sparkle" style="top:10%; right:12%;"></span>
  <span class="y2k-sparkle" style="bottom:18%; left:48%;"></span>

  <div class="layout">
    <div class="info-col">
      <div id="s{{SCENE_NUM}}-badge" class="badge">{{BADGE_TEXT}}</div>
      <h1 id="s{{SCENE_NUM}}-title" class="title-xl grad-text">{{TITLE}}</h1>
      <p id="s{{SCENE_NUM}}-subtitle" class="subtitle">{{SUBTITLE}}</p>
      <p id="s{{SCENE_NUM}}-desc" class="body-text">{{DESC}}</p>
    </div>
    <div class="visual-col">
      <div class="visual-block glow-card" style="padding:40px;">
        <div class="formula-stack">
          <span class="formula-pill pink">{{PILL_1_ICON}} {{PILL_1_TEXT}}</span>
          <span class="formula-operator">+</span>
          <span class="formula-pill yellow">{{PILL_2_ICON}} {{PILL_2_TEXT}}</span>
          <span class="formula-operator">+</span>
          <span class="formula-pill green">{{PILL_3_ICON}} {{PILL_3_TEXT}}</span>
          <span class="formula-operator">+</span>
          <span class="formula-pill blue">{{PILL_4_ICON}} {{PILL_4_TEXT}}</span>
        </div>
        <div style="background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.06); padding:24px; border-radius:16px; font-family:'Be Vietnam Pro', sans-serif; font-size:1.25rem; line-height:1.7; text-align:left; margin-top:20px;">
          <span style="color:#f472b6; font-weight:600;">{{FORMULA_LINE_1}}</span>
          <span style="color:#fde047; font-weight:600;"> {{FORMULA_LINE_2}}</span>
          <span style="color:#4ade80; font-weight:600;"> {{FORMULA_LINE_3}}</span>
          <span style="color:#38bdf8; font-weight:600;"> {{FORMULA_LINE_4}}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="corner-bracket tl"></div><div class="corner-bracket tr"></div>
  <div class="corner-bracket bl"></div><div class="corner-bracket br"></div>
  <div class="top-line"></div>
  <span class="scene-num">{{SCENE_NUM_PADDED}}</span>
</div>
