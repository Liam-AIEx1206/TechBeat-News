<div class="scene data" id="scene{{SCENE_NUM}}">
  <div class="float-orb-md" style="top:-10%; right:-5%; background:var(--accent);"></div>
  <div class="aurora-glow" style="bottom:-15%; left:-10%; background:radial-gradient(circle, var(--accent3), transparent);"></div>
  <div class="ghost-text" style="top:-10%; left:-5%;">{{GHOST_WORD}}</div>
  <span class="y2k-sparkle" style="top:12%; right:10%;"></span>
  <span class="y2k-sparkle" style="bottom:15%; left:48%;"></span>

  <div class="layout">
    <div class="info-col">
      <div id="s{{SCENE_NUM}}-badge" class="badge">{{BADGE_TEXT}}</div>
      <h1 id="s{{SCENE_NUM}}-title" class="title-xl grad-text">{{TITLE}}</h1>
      <p id="s{{SCENE_NUM}}-subtitle" class="subtitle">{{SUBTITLE}}</p>
      <p id="s{{SCENE_NUM}}-desc" class="body-text">{{DESC}}</p>
    </div>
    <div class="visual-col">
      <div class="compare breath">
        <div class="col glow-card">
          <h4>{{COL_GOOD_TITLE}}</h4>
          <ul>
            <li>{{COL_GOOD_1}}</li>
            <li>{{COL_GOOD_2}}</li>
            <li>{{COL_GOOD_3}}</li>
          </ul>
        </div>
        <div class="col bad glow-card">
          <h4>{{COL_BAD_TITLE}}</h4>
          <ul>
            <li>{{COL_BAD_1}}</li>
            <li>{{COL_BAD_2}}</li>
            <li>{{COL_BAD_3}}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="corner-bracket tl"></div><div class="corner-bracket tr"></div>
  <div class="corner-bracket bl"></div><div class="corner-bracket br"></div>
  <div class="top-line"></div>
  <span class="scene-num">{{SCENE_NUM_PADDED}}</span>
</div>
