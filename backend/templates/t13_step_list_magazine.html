<div class="scene magazine" id="scene{{SCENE_NUM}}">
  <div class="aurora-glow" style="top:-15%; right:-10%; background:radial-gradient(circle, var(--accent), transparent);"></div>
  <div class="float-orb-sm" style="bottom:12%; left:5%; background:var(--accent2);"></div>
  <div class="ghost-text" style="bottom:-8%; left:-5%;">{{GHOST_WORD}}</div>
  <span class="y2k-sparkle" style="top:8%; left:48%;"></span>
  <span class="y2k-sparkle" style="bottom:18%; right:10%;"></span>

  <div class="layout">
    <div class="info-col">
      <div id="s{{SCENE_NUM}}-badge" class="badge">{{BADGE_TEXT}}</div>
      <h1 id="s{{SCENE_NUM}}-title" class="title-xl grad-text">{{TITLE}}</h1>
      <p id="s{{SCENE_NUM}}-subtitle" class="subtitle">{{SUBTITLE}}</p>
      <p id="s{{SCENE_NUM}}-desc" class="body-text">{{DESC}}</p>
    </div>
    <div class="visual-col">
      <div class="visual-block glow-card" style="padding:40px;">
        <div class="caption" style="color:var(--accent2); font-weight:700; margin-bottom:20px; text-transform:uppercase; text-align:left;">{{STEP_HEADER}}</div>
        <div class="step-list">
          <div class="step-item">
            <div class="step-circle">1</div>
            <div class="step-text" style="text-align:left; font-weight:500;">{{STEP_1_ICON}} {{STEP_1_TEXT}}</div>
          </div>
          <div class="step-item">
            <div class="step-circle">2</div>
            <div class="step-text" style="text-align:left; font-weight:500;">{{STEP_2_ICON}} {{STEP_2_TEXT}}</div>
          </div>
          <div class="step-item">
            <div class="step-circle">3</div>
            <div class="step-text" style="text-align:left; font-weight:500;">{{STEP_3_ICON}} {{STEP_3_TEXT}}</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="corner-bracket tl"></div><div class="corner-bracket tr"></div>
  <div class="corner-bracket bl"></div><div class="corner-bracket br"></div>
  <div class="top-line"></div>
  <span class="scene-num">{{SCENE_NUM_PADDED}}</span>
</div>
