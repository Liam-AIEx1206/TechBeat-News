<div class="scene data" id="scene{{SCENE_NUM}}">
  <style>
    #scene{{SCENE_NUM}} .gantt-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 40px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
      backdrop-filter: blur(20px);
    }
    #scene{{SCENE_NUM}} .gantt-row {
      display: grid;
      grid-template-columns: 200px 1fr;
      align-items: center;
      gap: 24px;
    }
    #scene{{SCENE_NUM}} .gantt-label {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent2);
    }
    #scene{{SCENE_NUM}} .gantt-bar-wrapper {
      position: relative;
      background: rgba(255,255,255,0.03);
      height: 48px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.03);
    }
    #scene{{SCENE_NUM}} .gantt-bar {
      height: 100%;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding-left: 24px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
    }
    #scene{{SCENE_NUM}} .gantt-bar.p1 { background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 65%; }
    #scene{{SCENE_NUM}} .gantt-bar.p2 { background: linear-gradient(90deg, var(--accent2), var(--accent3)); width: 80%; }
    #scene{{SCENE_NUM}} .gantt-bar.p3 { background: linear-gradient(90deg, var(--accent3), var(--accent)); width: 95%; }
  </style>

  <div class="layout">
    <div class="info-col">
      <div id="s{{SCENE_NUM}}-badge" class="badge shimmer-fast">{{BADGE_TEXT}}</div>
      <h1 id="s{{SCENE_NUM}}-title" class="title-xl grad-text">{{TITLE}}</h1>
      <p id="s{{SCENE_NUM}}-subtitle" class="subtitle">{{SUBTITLE}}</p>
    </div>
    <div class="visual-col">
      <div class="gantt-container">
        <div class="gantt-row">
          <div class="gantt-label">{{TL_1_YEAR}}</div>
          <div class="gantt-bar-wrapper">
            <div class="gantt-bar p1">{{TL_1_EVENT}}</div>
          </div>
        </div>
        <div class="gantt-row">
          <div class="gantt-label">{{TL_2_YEAR}}</div>
          <div class="gantt-bar-wrapper">
            <div class="gantt-bar p2">{{TL_2_EVENT}}</div>
          </div>
        </div>
        <div class="gantt-row">
          <div class="gantt-label">{{TL_3_YEAR}}</div>
          <div class="gantt-bar-wrapper">
            <div class="gantt-bar p3">{{TL_3_EVENT}}</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="corner-bracket tl"></div><div class="corner-bracket tr"></div>
  <div class="corner-bracket bl"></div><div class="corner-bracket br"></div>
  <div class="top-line"></div>
  <span class="scene-num">{{SCENE_NUM_PADDED}}</span>
</div>
