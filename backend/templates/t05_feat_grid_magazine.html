<div class="scene magazine" id="scene{{SCENE_NUM}}">
  <div class="float-orb-md" style="top:-10%; left:-5%; background:var(--accent2);"></div>
  <div class="aurora-glow" style="bottom:-15%; right:-10%; background:radial-gradient(circle, var(--accent3), transparent);"></div>
  <div class="ghost-text" style="top:-10%; left:-5%;">{{GHOST_WORD}}</div>
  <span class="y2k-sparkle" style="top:8%; right:10%;"></span>
  <span class="y2k-sparkle" style="bottom:15%; left:48%;"></span>

  <div class="layout">
    <div class="info-col">
      <div id="s{{SCENE_NUM}}-badge" class="badge">{{BADGE_TEXT}}</div>
      <h1 id="s{{SCENE_NUM}}-title" class="title-xl grad-text">{{TITLE}}</h1>
      <p id="s{{SCENE_NUM}}-subtitle" class="subtitle">{{SUBTITLE}}</p>
      <p id="s{{SCENE_NUM}}-desc" class="body-text">{{DESC}}</p>
    </div>
    <div class="visual-col">
      <div class="feat-grid">
        <div class="feat-card glow-card">
          <div class="ic">{{FEAT_1_ICON}}</div>
          <div class="t">{{FEAT_1_TITLE}}</div>
          <div class="d">{{FEAT_1_DESC}}</div>
        </div>
        <div class="feat-card glow-card" style="animation-delay: 0.3s;">
          <div class="ic">{{FEAT_2_ICON}}</div>
          <div class="t">{{FEAT_2_TITLE}}</div>
          <div class="d">{{FEAT_2_DESC}}</div>
        </div>
        <div class="feat-card glow-card" style="animation-delay: 0.6s;">
          <div class="ic">{{FEAT_3_ICON}}</div>
          <div class="t">{{FEAT_3_TITLE}}</div>
          <div class="d">{{FEAT_3_DESC}}</div>
        </div>
        <div class="feat-card glow-card" style="animation-delay: 0.9s;">
          <div class="ic">{{FEAT_4_ICON}}</div>
          <div class="t">{{FEAT_4_TITLE}}</div>
          <div class="d">{{FEAT_4_DESC}}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="corner-bracket tl"></div><div class="corner-bracket tr"></div>
  <div class="corner-bracket bl"></div><div class="corner-bracket br"></div>
  <div class="top-line"></div>
  <span class="scene-num">{{SCENE_NUM_PADDED}}</span>
</div>
