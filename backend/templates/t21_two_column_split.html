<div class="scene split" id="scene{{SCENE_NUM}}">
  <style>
    #scene{{SCENE_NUM}} .layout {
      grid-template-columns: 1fr 1.1fr !important;
      gap: 60px;
    }
    #scene{{SCENE_NUM}} .featured-box {
      background: var(--surface);
      border-radius: 24px;
      padding: 50px;
      border: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      gap: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      backdrop-filter: blur(20px);
    }
    #scene{{SCENE_NUM}} .featured-header {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 10px;
    }
    #scene{{SCENE_NUM}} .bullet-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    #scene{{SCENE_NUM}} .bullet-item {
      font-size: 1.4rem;
      color: var(--text2);
      display: flex;
      gap: 16px;
      line-height: 1.6;
    }
    #scene{{SCENE_NUM}} .bullet-icon {
      color: var(--accent3);
      font-weight: bold;
    }
  </style>

  <div class="layout">
    <!-- Swapped: Visual Column on the Left -->
    <div class="visual-col">
      <div class="featured-box">
        <div class="featured-header">{{BRAND_NAME}}</div>
        <ul class="bullet-list">
          <li class="bullet-item">
            <span class="bullet-icon">✦</span>
            <span>{{BULLET_1}}</span>
          </li>
          <li class="bullet-item">
            <span class="bullet-icon">✦</span>
            <span>{{BULLET_2}}</span>
          </li>
          <li class="bullet-item">
            <span class="bullet-icon">✦</span>
            <span>{{BULLET_3}}</span>
          </li>
        </ul>
      </div>
    </div>

    <!-- Swapped: Info Column on the Right -->
    <div class="info-col">
      <div id="s{{SCENE_NUM}}-badge" class="badge shimmer-fast">{{BADGE_TEXT}}</div>
      <h1 id="s{{SCENE_NUM}}-title" class="title-xl grad-text">{{TITLE}}</h1>
      <p id="s{{SCENE_NUM}}-subtitle" class="subtitle">{{SUBTITLE}}</p>
      <p id="s{{SCENE_NUM}}-desc" class="body-text">{{DESC}}</p>
    </div>
  </div>

  <div class="corner-bracket tl"></div><div class="corner-bracket tr"></div>
  <div class="corner-bracket bl"></div><div class="corner-bracket br"></div>
  <div class="top-line"></div>
  <span class="scene-num">{{SCENE_NUM_PADDED}}</span>
</div>
