<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden;
    background:linear-gradient(135deg,#08080f 0%,#0f0f1a 55%,#08080f 100%);
    font-family:Arial,Helvetica,sans-serif;color:#f5f3ff}
  .wrap{position:relative;width:100%;height:100%;padding:60px 80px}
  .ghost{position:absolute;right:40px;bottom:-40px;font-size:300px;font-weight:800;
    color:#f97316;opacity:.06;letter-spacing:-8px;line-height:1}
  .bracket{position:absolute;top:64px;left:80px;width:36px;height:36px;
    border-left:3px solid #f97316;border-top:3px solid #f97316}
  .kicker{display:inline-flex;align-items:center;gap:10px;margin-top:96px;
    padding:8px 18px;border:1px solid rgba(249,115,22,.55);border-radius:20px}
  .kicker span{width:8px;height:8px;border-radius:50%;background:#f97316}
  .kicker b{font-size:16px;letter-spacing:3px;color:#fb923c}
  h1{font-size:92px;font-weight:800;letter-spacing:-2px;margin-top:36px;line-height:1.05}
  h1 em{color:#f97316;font-style:normal}
  .rule{width:180px;height:6px;margin-top:22px;border-radius:3px;
    background:linear-gradient(90deg,#f97316,#fbbf24)}
  p{font-size:30px;color:#a09db8;margin-top:36px;max-width:720px;line-height:1.5}
  .chips{position:absolute;left:80px;bottom:56px;display:flex;gap:12px}
  .chip{font-size:15px;color:#a09db8;background:#141420;padding:9px 18px;border-radius:18px}
</style></head><body>
  <div class="wrap">
    <div class="bracket"></div>
    <div class="ghost">26</div>
    <div class="kicker"><span></span><b>CYBER ORANGE</b></div>
    <h1>Bản tin công nghệ<br>chuẩn <em>editorial</em></h1>
    <div class="rule"></div>
    <p>Nền tối cao cấp, accent cam ấm làm điểm nhấn — cảm giác một đài tin tức hiện đại.</p>
    <div class="chips"><div class="chip">Style pack</div><div class="chip">16:9</div></div>
  </div>
</body></html>
