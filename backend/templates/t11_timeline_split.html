<div class="scene split" id="scene{{SCENE_NUM}}">
  <div class="aurora-glow" style="top:-15%; left:-10%; background:radial-gradient(circle, var(--accent2), transparent);"></div>
  <div class="float-orb-sm" style="bottom:15%; right:8%; background:var(--accent);"></div>
  <div class="ghost-text" style="bottom:-8%; right:-5%;">{{GHOST_WORD}}</div>
  <span class="y2k-sparkle" style="top:10%; right:48%;"></span>
  <span class="y2k-sparkle" style="bottom:20%; left:8%;"></span>

  <div class="layout">
    <div class="info-col">
      <div id="s{{SCENE_NUM}}-badge" class="badge">{{BADGE_TEXT}}</div>
      <h1 id="s{{SCENE_NUM}}-title" class="title-xl grad-text">{{TITLE}}</h1>
      <p id="s{{SCENE_NUM}}-subtitle" class="subtitle">{{SUBTITLE}}</p>
      <p id="s{{SCENE_NUM}}-desc" class="body-text">{{DESC}}</p>
    </div>
    <div class="visual-col">
      <div class="tl-list breath">
        <div class="tl-item">
          <div class="y">{{TL_1_YEAR}}</div>
          <div class="t">{{TL_1_EVENT}}</div>
          <div class="d">{{TL_1_DESC}}</div>
        </div>
        <div class="tl-item">
          <div class="y">{{TL_2_YEAR}}</div>
          <div class="t">{{TL_2_EVENT}}</div>
          <div class="d">{{TL_2_DESC}}</div>
        </div>
        <div class="tl-item">
          <div class="y">{{TL_3_YEAR}}</div>
          <div class="t">{{TL_3_EVENT}}</div>
          <div class="d">{{TL_3_DESC}}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="corner-bracket tl"></div><div class="corner-bracket tr"></div>
  <div class="corner-bracket bl"></div><div class="corner-bracket br"></div>
  <div class="top-line"></div>
  <span class="scene-num">{{SCENE_NUM_PADDED}}</span>
</div>
