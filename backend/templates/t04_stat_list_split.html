<div class="scene split" id="scene{{SCENE_NUM}}">
  <div class="aurora-glow" style="top:-15%; right:-10%; background:radial-gradient(circle, var(--accent), transparent);"></div>
  <div class="float-orb-sm" style="bottom:10%; left:5%; background:var(--accent3);"></div>
  <div class="ghost-text" style="bottom:-8%; right:-5%;">{{GHOST_WORD}}</div>
  <span class="y2k-sparkle" style="top:10%; right:15%;"></span>
  <span class="y2k-sparkle" style="bottom:20%; left:45%;"></span>

  <div class="layout">
    <div class="info-col">
      <div id="s{{SCENE_NUM}}-badge" class="badge">{{BADGE_TEXT}}</div>
      <h1 id="s{{SCENE_NUM}}-title" class="title-xl grad-text">{{TITLE}}</h1>
      <p id="s{{SCENE_NUM}}-subtitle" class="subtitle">{{SUBTITLE}}</p>
      <p id="s{{SCENE_NUM}}-desc" class="body-text">{{DESC}}</p>
    </div>
    <div class="visual-col">
      <div class="stat-list">
        <div class="stat-list-card shimmer-fast glow-card">
          <div class="ic-wrap">{{STAT_1_ICON}}</div>
          <div class="num">{{STAT_1_NUM}}</div>
          <div class="details">
            <div class="title">{{STAT_1_TITLE}}</div>
            <div class="desc">{{STAT_1_DESC}}</div>
          </div>
        </div>
        <div class="stat-list-card shimmer-fast glow-card" style="animation-delay: 0.4s;">
          <div class="ic-wrap">{{STAT_2_ICON}}</div>
          <div class="num">{{STAT_2_NUM}}</div>
          <div class="details">
            <div class="title">{{STAT_2_TITLE}}</div>
            <div class="desc">{{STAT_2_DESC}}</div>
          </div>
        </div>
        <div class="stat-list-card shimmer-fast glow-card" style="animation-delay: 0.8s;">
          <div class="ic-wrap">{{STAT_3_ICON}}</div>
          <div class="num">{{STAT_3_NUM}}</div>
          <div class="details">
            <div class="title">{{STAT_3_TITLE}}</div>
            <div class="desc">{{STAT_3_DESC}}</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="corner-bracket tl"></div><div class="corner-bracket tr"></div>
  <div class="corner-bracket bl"></div><div class="corner-bracket br"></div>
  <div class="top-line"></div>
  <span class="scene-num">{{SCENE_NUM_PADDED}}</span>
</div>
