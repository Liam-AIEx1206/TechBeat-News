<div class="scene data" id="scene{{SCENE_NUM}}">
  <div class="animated-grid"></div>
  <div class="float-orb-sm" style="top:10%; right:5%; background:var(--accent);"></div>
  <div class="ghost-text" style="bottom:-8%; left:-5%;">{{GHOST_WORD}}</div>
  <span class="y2k-sparkle" style="top:12%; left:48%;"></span>
  <span class="y2k-sparkle" style="bottom:18%; right:8%;"></span>

  <div class="layout">
    <div class="info-col">
      <div id="s{{SCENE_NUM}}-badge" class="badge">{{BADGE_TEXT}}</div>
      <h1 id="s{{SCENE_NUM}}-title" class="title-xl grad-text">{{TITLE}}</h1>
      <p id="s{{SCENE_NUM}}-subtitle" class="subtitle">{{SUBTITLE}}</p>
      <p id="s{{SCENE_NUM}}-desc" class="body-text">{{DESC}}</p>
    </div>
    <div class="visual-col">
      <div class="terminal breath">
        <div class="dots"><i></i><i></i><i></i></div>
        <div><span class="c">// {{CODE_COMMENT}}</span></div>
        <div><span class="k">{{CODE_KW_1}}</span> {{CODE_VAR_1}} = <span class="s">"{{CODE_VAL_1}}"</span>;</div>
        <div><span class="k">{{CODE_KW_2}}</span> {{CODE_FUNC}}() {</div>
        <div>  <span class="k">return</span> {{CODE_BODY}};</div>
        <div>}</div>
        <div></div>
        <div><span class="c">// {{CODE_COMMENT_2}}</span></div>
        <div><span class="k">{{CODE_KW_3}}</span> {{CODE_VAR_2}} = <span class="s">"{{CODE_VAL_2}}"</span>;</div>
        <div>$ <span class="cursor"></span></div>
      </div>
    </div>
  </div>

  <div class="corner-bracket tl"></div><div class="corner-bracket tr"></div>
  <div class="corner-bracket bl"></div><div class="corner-bracket br"></div>
  <div class="top-line"></div>
  <span class="scene-num">{{SCENE_NUM_PADDED}}</span>
</div>
