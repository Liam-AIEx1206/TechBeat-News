<div class="scene custom" id="scene{{SCENE_NUM}}">
  <style>
    #scene{{SCENE_NUM}} .bento-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 20px;
      width: 100%;
      height: 480px;
    }
    #scene{{SCENE_NUM}} .bento-card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    #scene{{SCENE_NUM}} .bento-card:hover {
      border-color: var(--accent2);
      transform: translateY(-2px);
    }
    #scene{{SCENE_NUM}} .bento-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent2);
    }
    #scene{{SCENE_NUM}} .bento-desc {
      font-size: 1.15rem;
      color: var(--text2);
      line-height: 1.5;
    }
    #scene{{SCENE_NUM}} .bento-card.c1 { border-top: 4px solid var(--accent); }
    #scene{{SCENE_NUM}} .bento-card.c2 { border-top: 4px solid var(--accent2); }
    #scene{{SCENE_NUM}} .bento-card.c3 { border-top: 4px solid var(--accent3); }
    #scene{{SCENE_NUM}} .bento-card.c4 { border-top: 4px solid var(--accent2); }
  </style>

  <div class="layout" style="padding-top: 80px; gap: 32px;">
    <div class="info-col" style="align-items: center; text-align: center;">
      <div id="s{{SCENE_NUM}}-badge" class="badge shimmer-fast">{{BADGE_TEXT}}</div>
      <h1 id="s{{SCENE_NUM}}-title" class="title-xl grad-text">{{TITLE}}</h1>
      <p id="s{{SCENE_NUM}}-subtitle" class="subtitle" style="font-size: 1.8rem; margin-top: -8px;">{{SUBTITLE}}</p>
    </div>
    
    <div class="bento-grid">
      <div class="bento-card c1">
        <div class="bento-title">⚡ {{FEAT_1_TITLE}}</div>
        <p class="bento-desc">{{FEAT_1_DESC}}</p>
      </div>
      <div class="bento-card c2">
        <div class="bento-title">🔒 {{FEAT_2_TITLE}}</div>
        <p class="bento-desc">{{FEAT_2_DESC}}</p>
      </div>
      <div class="bento-card c3">
        <div class="bento-title">🚀 {{FEAT_3_TITLE}}</div>
        <p class="bento-desc">{{FEAT_3_DESC}}</p>
      </div>
      <div class="bento-card c4">
        <div class="bento-title">🌍 {{FEAT_4_TITLE}}</div>
        <p class="bento-desc">{{FEAT_4_DESC}}</p>
      </div>
    </div>
  </div>

  <div class="corner-bracket tl"></div><div class="corner-bracket tr"></div>
  <div class="corner-bracket bl"></div><div class="corner-bracket br"></div>
  <div class="top-line"></div>
  <span class="scene-num">{{SCENE_NUM_PADDED}}</span>
</div>
