<div class="scene centered" id="scene{{SCENE_NUM}}">
  <style>
    #scene{{SCENE_NUM}} .flow-pipeline {
      display: grid;
      grid-template-columns: 1fr 40px 1fr 40px 1fr;
      align-items: center;
      width: 100%;
      max-width: 1600px;
      margin-top: 40px;
    }
    #scene{{SCENE_NUM}} .flow-step {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 24px;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      text-align: center;
      height: 260px;
      justify-content: center;
    }
    #scene{{SCENE_NUM}} .flow-step:hover {
      border-color: var(--accent2);
      transform: translateY(-4px);
    }
    #scene{{SCENE_NUM}} .flow-step.s1 { border-top: 5px solid var(--accent); }
    #scene{{SCENE_NUM}} .flow-step.s2 { border-top: 5px solid var(--accent2); }
    #scene{{SCENE_NUM}} .flow-step.s3 { border-top: 5px solid var(--accent3); }
    
    #scene{{SCENE_NUM}} .flow-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
    }
    #scene{{SCENE_NUM}} .flow-step.s1 .flow-icon { background: var(--accent); }
    #scene{{SCENE_NUM}} .flow-step.s2 .flow-icon { background: var(--accent2); }
    #scene{{SCENE_NUM}} .flow-step.s3 .flow-icon { background: var(--accent3); }
    
    #scene{{SCENE_NUM}} .flow-text {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text1);
      line-height: 1.6;
    }
    #scene{{SCENE_NUM}} .flow-arrow {
      font-size: 2.2rem;
      color: var(--accent2);
      opacity: 0.5;
      text-align: center;
      font-weight: bold;
    }
  </style>

  <div class="layout" style="padding-top: 60px; gap: 40px;">
    <div class="info-col">
      <div id="s{{SCENE_NUM}}-badge" class="badge shimmer-fast" style="margin: 0 auto;">{{BADGE_TEXT}}</div>
      <h1 id="s{{SCENE_NUM}}-title" class="title-xl grad-text" style="font-size: 3.5rem;">{{TITLE}}</h1>
      <p id="s{{SCENE_NUM}}-subtitle" class="subtitle" style="font-size: 1.8rem; margin-top: -12px;">{{SUBTITLE}}</p>
    </div>
    
    <div class="flow-pipeline">
      <div class="flow-step s1">
        <div class="flow-icon">{{STEP_1_ICON}}</div>
        <div class="flow-text">{{STEP_1_TEXT}}</div>
      </div>
      <div class="flow-arrow">➔</div>
      <div class="flow-step s2">
        <div class="flow-icon">{{STEP_2_ICON}}</div>
        <div class="flow-text">{{STEP_2_TEXT}}</div>
      </div>
      <div class="flow-arrow">➔</div>
      <div class="flow-step s3">
        <div class="flow-icon">{{STEP_3_ICON}}</div>
        <div class="flow-text">{{STEP_3_TEXT}}</div>
      </div>
    </div>
  </div>

  <div class="corner-bracket tl"></div><div class="corner-bracket tr"></div>
  <div class="corner-bracket bl"></div><div class="corner-bracket br"></div>
  <div class="top-line"></div>
  <span class="scene-num">{{SCENE_NUM_PADDED}}</span>
</div>
