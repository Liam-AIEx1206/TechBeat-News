<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="__BG__"/>
    <stop offset="100%" stop-color="__BG2__"/>
  </linearGradient>
  <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="__ACCENT__"/>
    <stop offset="100%" stop-color="__ACCENT3__"/>
  </linearGradient>
  <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="__ACCENT__" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="__ACCENT__"/>
  </linearGradient>
</defs>

<g id="background">
  <rect x="0" y="0" width="1280" height="720" fill="url(#bgWash)"/>
  <text x="1256" y="700" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="190" font-weight="bold" fill="__TEXT1__" fill-opacity="0.04">04</text>
</g>

<g id="header">
  <text x="80" y="60" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="__ACCENT2__" letter-spacing="4">LỘ TRÌNH</text>
  <text x="80" y="122" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="__TEXT1__">18 ngày đàm phán nghẹt thở</text>
  <rect x="82" y="146" width="140" height="5" rx="2.5" fill="url(#rule)"/>
</g>

<g id="spine">
  <line x1="150" y1="380" x2="1130" y2="380" stroke="url(#spine)" stroke-width="3"/>
</g>

<g id="step-1">
  <circle cx="200" cy="380" r="36" fill="__BG2__" stroke="__ACCENT__" stroke-width="2"/>
  <use data-icon="phosphor-duotone/flag" x="182" y="362" width="36" height="36" fill="__ACCENT__"/>
  <text x="200" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="__ACCENT2__">12/6</text>
  <text x="200" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="__TEXT1__">Lệnh cấm</text>
  <text x="200" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="__TEXT2__">Xuất khẩu bị đóng băng</text>
</g>

<g id="step-2">
  <circle cx="480" cy="380" r="36" fill="__BG2__" stroke="__ACCENT__" stroke-width="2"/>
  <use data-icon="phosphor-duotone/users" x="462" y="362" width="36" height="36" fill="__ACCENT__"/>
  <text x="480" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="__ACCENT2__">14/6</text>
  <text x="480" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="__TEXT1__">Đàm phán</text>
  <text x="480" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="__TEXT2__">Anthropic gặp cơ quan quản lý</text>
</g>

<g id="step-3">
  <circle cx="760" cy="380" r="36" fill="__BG2__" stroke="__ACCENT__" stroke-width="2"/>
  <use data-icon="phosphor-duotone/shield-check" x="742" y="362" width="36" height="36" fill="__ACCENT__"/>
  <text x="760" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="__ACCENT2__">24/6</text>
  <text x="760" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="__TEXT1__">Bộ lọc mới</text>
  <text x="760" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="__TEXT2__">Chặn 99% kỹ thuật bẻ khóa</text>
</g>

<g id="step-4">
  <circle cx="1040" cy="380" r="42" fill="__ACCENT__"/>
  <use data-icon="phosphor-duotone/rocket" x="1020" y="360" width="40" height="40" fill="__BG__"/>
  <text x="1040" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="__ACCENT2__">2/7</text>
  <text x="1040" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="__ACCENT2__">Trở lại</text>
  <text x="1040" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="__TEXT2__">Fable 5 mở cửa toàn cầu</text>
</g>

<g id="footer">
  <line x1="80" y1="632" x2="1200" y2="632" stroke="__TEXT2__" stroke-width="1" stroke-opacity="0.12"/>
  <text x="80" y="666" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="__TEXT2__">Sự kiện Anthropic · 2026</text>
  <text x="1200" y="666" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="__TEXT2__">4 / 7</text>
</g>
</svg>
