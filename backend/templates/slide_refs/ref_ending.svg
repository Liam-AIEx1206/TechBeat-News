<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgWash" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="__BG__"/>
    <stop offset="50%" stop-color="__BG2__"/>
    <stop offset="100%" stop-color="__BG__"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="42%" r="55%">
    <stop offset="0%" stop-color="__ACCENT__" stop-opacity="0.13"/>
    <stop offset="100%" stop-color="__ACCENT__" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="__ACCENT__"/>
    <stop offset="100%" stop-color="__ACCENT3__"/>
  </linearGradient>
</defs>

<g id="background">
  <rect x="0" y="0" width="1280" height="720" fill="url(#bgWash)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#glow)"/>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="300" font-weight="bold" fill="__TEXT1__" fill-opacity="0.035">AI</text>
</g>

<g id="decor">
  <path d="M 80 64 L 80 100 M 80 64 L 116 64" stroke="__ACCENT__" stroke-width="3" fill="none"/>
  <path d="M 1200 656 L 1200 620 M 1200 656 L 1164 656" stroke="__ACCENT__" stroke-width="3" fill="none"/>
  <line x1="560" y1="180" x2="720" y2="180" stroke="url(#rule)" stroke-width="4"/>
</g>

<g id="takeaway">
  <text x="640" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="__ACCENT2__" letter-spacing="5">ĐIỀU ĐỌNG LẠI</text>
  <text x="640" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="bold" fill="__TEXT1__">An toàn không còn là</text>
  <text x="640" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="bold" fill="__TEXT1__">lựa chọn — mà là <tspan fill="__ACCENT__">giá vé</tspan></text>
  <text x="640" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="__TEXT2__">18 ngày khủng hoảng của Anthropic đặt chuẩn mới cho toàn ngành AI.</text>
</g>

<g id="chips">
  <rect x="404" y="540" width="200" height="44" rx="22" fill="__SURFACE__"/>
  <use data-icon="phosphor-duotone/calendar" x="428" y="551" width="22" height="22" fill="__ACCENT__"/>
  <text x="462" y="568" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="__TEXT2__">Hè 2026</text>
  <rect x="628" y="540" width="248" height="44" rx="22" fill="none" stroke="__ACCENT__" stroke-width="1" stroke-opacity="0.5"/>
  <use data-icon="phosphor-duotone/broadcast" x="652" y="551" width="22" height="22" fill="__ACCENT__"/>
  <text x="686" y="568" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="__ACCENT2__">TechBeat News</text>
</g>

<g id="signoff">
  <text x="640" y="668" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="__TEXT2__">Cảm ơn đã theo dõi · 7 / 7</text>
</g>
</svg>
